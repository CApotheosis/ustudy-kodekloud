# Prometheus Configuration File
# This file defines how Prometheus collects metrics from targets

# Global configuration applies to all scrape jobs
global:
  # How often Prometheus scrapes targets (default: 1m)
  scrape_interval: 15s

  # How often Prometheus evaluates alerting rules (used in Module 4)
  evaluation_interval: 15s

  # Optional: Labels to add to all metrics before storing
  # Useful for identifying which Prometheus server collected the data
  external_labels:
    monitor: "aiops-lab"
    environment: "learning"

# Scrape configuration - defines which targets to monitor
scrape_configs:
  # TODO: Add your scrape jobs here!
  #
  # Each job should follow this structure:
  #
  # - job_name: 'descriptive-name'
  #   static_configs:
  #     - targets:
  #         - 'host:port'
  #
  # Example jobs to add:
  # 1. Prometheus self-monitoring (container name: prometheus, port 9090)
  # 2. Node Exporter (container name: node-exporter, port 9100)
  #
  # Remember:
  # - Use 2 spaces for indentation (no tabs!)
  # - job_name becomes a label on all metrics
  # - Use container names for targets: 'container-name:port' (no http://)
  # - Multiple targets can be in the same job
